apiVersion: v1
kind: Service
metadata:
  name: {{ include "logstash.fullname" . }}
  labels:
    {{- include "logstash.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: syslog-tcp
      port: {{ .Values.service.port }}
      targetPort: syslog-tcp
      protocol: TCP
    - name: syslog-udp
      port: {{ .Values.service.port }}
      targetPort: syslog-udp
      protocol: UDP
  selector:
    {{- include "logstash.selectorLabels" . | nindent 4 }}

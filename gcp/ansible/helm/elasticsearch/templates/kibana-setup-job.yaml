apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-kibana-setup
  namespace: {{ .Release.Namespace | default "support" }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: setup-kibana-objects
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          # Récupérer le mot de passe elastic
          ELASTIC_PASSWORD=$(cat /etc/elastic-credentials/elastic)

          # Attendre que Kibana soit prêt
          until curl -s -k -u "elastic:$ELASTIC_PASSWORD" -I https://eventsindex-kb-http:5601/api/status | grep -q "200 OK"; do
            echo "Waiting for Kibana to be ready..."
            sleep 10
          done

          echo "Kibana is ready. Configuring objects..."

          # 1. Créer le Data View avec un ID FIXE (attendu par la visualisation)
          DATAVIEW_ID="c89f10e8-88d8-447c-b0e1-cbbe38d4502f"
          
          # Nettoyage des anciens Data Views nommés *index* pour éviter les doublons
          EXISTING_DV_ID=$(curl -s -k -u "elastic:$ELASTIC_PASSWORD" "https://eventsindex-kb-http:5601/api/data_views" | sed -n 's/.*"id":"\([^"]*\)","namespaces":\[[^]]*\],"title":"\*index\*".*/\1/p' | head -1)
          if [ ! -z "$EXISTING_DV_ID" ]; then
            echo "Deleting existing Data View $EXISTING_DV_ID..."
            curl -X DELETE "https://eventsindex-kb-http:5601/api/data_views/data_view/$EXISTING_DV_ID" -u "elastic:$ELASTIC_PASSWORD" -k -s -H "kbn-xsrf: true"
          fi

          echo "Creating Data View with fixed ID $DATAVIEW_ID..."
          curl -X POST "https://eventsindex-kb-http:5601/api/data_views/data_view" \
            -u "elastic:$ELASTIC_PASSWORD" -k -s -H "kbn-xsrf: true" -H "Content-Type: application/json" \
            -d "{
              \"data_view\": {
                 \"id\": \"$DATAVIEW_ID\",
                 \"title\": \"*index*\",
                 \"name\": \"all\",
                 \"timeFieldName\": \"@timestamp\"
              }
            }"

          # 2. Créer la Visualisation "typicaltimeseries"
          VIS_ID="74891210-34ae-11f1-932f-0f26c7316460"
          echo "Creating Visualization $VIS_ID..."
          
          # On utilise l'API Saved Objects avec overwrite=true
          curl -X POST "https://eventsindex-kb-http:5601/api/saved_objects/visualization/$VIS_ID?overwrite=true" \
            -u "elastic:$ELASTIC_PASSWORD" -k -s -H "kbn-xsrf: true" -H "Content-Type: application/json" \
            -d '{
              "attributes": {
                "title": "typicaltimeseries",
                "description": "mY favourYte",
                "visState": "{\"title\":\"typicaltimeseries\",\"type\":\"histogram\",\"aggs\":[{\"id\":\"1\",\"enabled\":true,\"type\":\"count\",\"params\":{\"emptyAsNull\":false},\"schema\":\"metric\"},{\"id\":\"2\",\"enabled\":true,\"type\":\"date_histogram\",\"params\":{\"field\":\"@timestamp\",\"timeRange\":{\"from\":\"now-24h/h\",\"to\":\"now\"},\"useNormalizedEsInterval\":true,\"extendToTimeRange\":false,\"scaleMetricValues\":false,\"interval\":\"auto\",\"used_interval\":\"30m\",\"drop_partials\":false,\"min_doc_count\":1,\"extended_bounds\":{}},\"schema\":\"segment\"},{\"id\":\"3\",\"enabled\":true,\"type\":\"terms\",\"params\":{\"field\":\"tags.keyword\",\"orderBy\":\"1\",\"order\":\"desc\",\"size\":55,\"otherBucket\":false,\"otherBucketLabel\":\"Other\",\"missingBucket\":false,\"missingBucketLabel\":\"Missing\",\"includeIsRegex\":true,\"excludeIsRegex\":true},\"schema\":\"group\"}],\"params\":{\"type\":\"histogram\",\"grid\":{\"categoryLines\":false,\"style\":{}},\"categoryAxes\":[{\"id\":\"CategoryAxis-1\",\"type\":\"category\",\"position\":\"bottom\",\"show\":true,\"scale\":{\"type\":\"linear\"},\"labels\":{\"show\":true,\"filter\":true,\"truncate\":100},\"title\":{},\"style\":{}}],\"valueAxes\":[{\"id\":\"ValueAxis-1\",\"name\":\"LeftAxis-1\",\"type\":\"value\",\"position\":\"left\",\"show\":true,\"scale\":{\"type\":\"linear\",\"mode\":\"normal\"},\"labels\":{\"show\":true,\"rotate\":0,\"filter\":true,\"truncate\":100},\"title\":{\"text\":\"\"},\"style\":{}}],\"seriesParams\":[{\"show\":true,\"type\":\"histogram\",\"mode\":\"stacked\",\"data\":{\"label\":\"Count\",\"id\":\"1\"},\"interpolate\":\"linear\",\"valueAxis\":\"ValueAxis-1\",\"drawLinesBetweenPoints\":true,\"lineWidth\":2,\"showCircles\":true,\"circlesRadius\":1}],\"radiusRatio\":0,\"addTooltip\":true,\"detailedTooltip\":true,\"palette\":{\"type\":\"palette\",\"name\":\"default\"},\"addLegend\":true,\"legendPosition\":\"right\",\"times\":[],\"addTimeMarker\":false,\"truncateLegend\":true,\"maxLegendLines\":1,\"labels\":{\"show\":false},\"thresholdLine\":{\"show\":false,\"value\":10,\"width\":1,\"style\":\"full\",\"color\":\"#E7664C\"}}}",
                "uiStateJSON": "{}",
                "version": 1,
                "kibanaSavedObjectMeta": {
                  "searchSourceJSON": "{\"query\":{\"language\":\"kuery\",\"query\":\"\"},\"filter\":[],\"indexRefName\":\"kibanaSavedObjectMeta.searchSourceJSON.index\"}"
                }
              },
              "references": [
                {
                  "name": "kibanaSavedObjectMeta.searchSourceJSON.index",
                  "type": "index-pattern",
                  "id": "c89f10e8-88d8-447c-b0e1-cbbe38d4502f"
                }
              ]
            }'
          
          echo "Done."
        volumeMounts:
        - name: elastic-credentials
          mountPath: /etc/elastic-credentials
          readOnly: true
      volumes:
      - name: elastic-credentials
        secret:
          secretName: eventsindex-es-elastic-user
